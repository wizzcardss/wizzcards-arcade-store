<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050914"><title>Detalle de carta | WizzCards</title>
<style>
:root{--bg:#050914;--panel:#101c32;--blue:#075bff;--cyan:#25d9ff;--gold:#ffd21c;--white:#f4f7ff;--muted:#aab9d2;--line:#1e4b91}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#102d65,transparent 55%),var(--bg);color:var(--white);font:18px Arial,sans-serif}.nav{padding:16px 5%;background:#050914ed;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:2px;color:white;text-decoration:none}.brand small{display:block;color:var(--gold);font-size:10px;margin-top:5px}.cart{color:white;background:var(--blue);border:1px solid var(--cyan);padding:10px 14px;text-decoration:none}.wrap{max-width:1100px;margin:30px auto;padding:0 20px}.back{color:var(--cyan);text-decoration:none;font-weight:bold}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;margin-top:22px}.gallery{position:relative;min-width:0}.carousel{position:relative;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle,#28558e,#101a30 70%);min-height:420px;touch-action:pan-y;cursor:grab}.carousel:active{cursor:grabbing}.slide{display:none;min-height:420px;place-items:center;position:relative;cursor:zoom-in}.slide.active{display:grid}.slide img{width:100%;height:420px;object-fit:contain}.placeholder{border:2px solid #8cc4ff88;background:linear-gradient(140deg,#ffffff22,#07142c);width:min(68%,320px);aspect-ratio:2.5/3.5;display:grid;place-items:center;text-align:center;padding:12px;color:#dcecff;font-weight:bold;text-shadow:2px 2px #0756b8}.slide small{position:absolute;bottom:12px;color:#dcecff;background:#071225cc;padding:6px 10px}.carousel-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:2;border:1px solid var(--cyan);background:#06152ddd;color:white;width:42px;height:42px;border-radius:50%;font-size:25px}.carousel-btn.prev{left:12px}.carousel-btn.next{right:12px}.carousel-dots{display:flex;justify-content:center;gap:9px;padding:14px}.carousel-dot{width:10px;height:10px;border:0;border-radius:50%;background:#61718d;padding:0}.carousel-dot.active{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}.carousel-caption{text-align:center;color:var(--muted);font-size:13px;letter-spacing:1px}.info{background:linear-gradient(155deg,#152847,#0d172a);border:1px solid var(--line);padding:26px}.tag{color:var(--cyan);font-size:12px;text-transform:uppercase;letter-spacing:2px}.info h1{font-size:clamp(27px,4vw,40px);margin:12px 0}.team{color:var(--muted);font-size:20px}.price{font-size:34px;color:var(--gold);font-weight:900;margin:20px 0}.specs{border-top:1px solid var(--line);margin-top:20px}.spec{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #1e4b9166}.spec span:first-child{color:var(--muted)}button{cursor:pointer}.add{margin-top:22px;width:100%;padding:15px;background:var(--blue);color:white;border:1px solid var(--cyan);font-size:17px;font-weight:bold}.note{color:var(--muted);font-size:14px;line-height:1.5}.error{text-align:center;padding:70px 15px}.zoom{display:none;position:fixed;inset:0;background:#000e;z-index:10;place-items:center;padding:20px;cursor:zoom-out;overflow:hidden;touch-action:none}.zoom.open{display:grid}.zoom img{max-width:95vw;max-height:92vh;object-fit:contain;transform:scale(1);transform-origin:center center;transition:transform .12s ease;user-select:none;-webkit-user-drag:none}.zoom.open.zoomed img{transform:scale(2.5);cursor:move}.zoom-hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#071225dd;border:1px solid var(--cyan);color:#fff;padding:9px 13px;border-radius:4px;font-size:13px;white-space:nowrap;pointer-events:none}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,100px);background:var(--gold);color:#111;padding:12px;font-weight:bold;transition:.2s}.toast.show{transform:translate(-50%,0)}
@media(max-width:700px){.layout{grid-template-columns:1fr}.carousel,.slide{min-height:320px}.slide img{height:320px}.info{padding:20px}.wrap{margin:20px auto}}
</style></head>
<body>
<header class="nav"><a class="brand" href="index.html">WIZZCARDS<small>HUNT THE RARE</small></a><a class="cart" href="index.html#catalogo">← CATÁLOGO</a></header>
<main class="wrap"><a class="back" href="index.html#catalogo">← Volver al catálogo</a><div id="content"><p>Cargando carta…</p></div></main>
<div class="zoom" id="zoom" aria-label="Visor ampliado"><img id="zoom-img" alt="Vista ampliada de la carta"><div class="zoom-hint">Mueve el cursor o el dedo para inspeccionar · Toca para ampliar</div></div><div class="toast" id="toast">Carta agregada al carrito</div>
<script src="supabase-config.js"></script>
<script>
const $=id=>document.getElementById(id),clp=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n),id=new URLSearchParams(location.search).get('id');
loadWizzCatalog().then(items=>{
 const p=items.find(x=>x.id===id);if(!p){$('content').innerHTML='<div class="error"><h1>No encontramos esta carta</h1><a class="back" href="index.html#catalogo">Volver a la tienda</a></div>';return}
 document.title=p.name+' | WizzCards';
 const front=p.imageFront||p.image_front,back=p.imageBack||p.image_back;
 const slides=[['FRENTE',front],['REVERSO',back]];const slide=(item,i)=>'<div class="slide '+(i===0?'active':'')+'" data-slide="'+i+'" '+(item[1]?'data-zoom="'+item[1]+'"':'')+'>'+(item[1]?'<img src="'+item[1]+'" alt="'+item[0]+' de '+p.name+'">':'<div class="placeholder">'+p.name+'<br><br>'+item[0]+'<br><small>Foto pendiente de cargar</small></div>')+'<small>'+item[0]+'</small></div>';
 $('content').innerHTML='<section class="layout"><div class="gallery"><div class="carousel" id="carousel">'+slides.map(slide).join('')+'<button class="carousel-btn prev" id="prev" aria-label="Foto anterior">‹</button><button class="carousel-btn next" id="next" aria-label="Foto siguiente">›</button></div><div class="carousel-dots"><button class="carousel-dot active" data-dot="0" aria-label="Ver frente"></button><button class="carousel-dot" data-dot="1" aria-label="Ver reverso"></button></div><div class="carousel-caption" id="carousel-caption">FRENTE · 1 / 2</div></div><div class="info"><div class="tag">'+p.category+' · Ficha de coleccionable</div><h1>'+p.name+'</h1><div class="team">'+(p.team||'')+'</div><div class="price">'+clp(p.price)+'</div><div class="specs">'+[['Colección',p.collection],['Variante',p.variant],['Número',p.number],['Código',p.id],['Disponibilidad',p.stock>0?'Disponible':'Consultar stock']].map(([a,b])=>'<div class="spec"><span>'+a+'</span><strong>'+(b||'No informado')+'</strong></div>').join('')+'</div><p class="note">Las fotografías reales y el estado de conservación se incorporarán a esta ficha cuando estén disponibles. Confirma disponibilidad antes de comprar.</p><button class="add" id="add">+ AGREGAR AL CARRITO</button></div></section>';
 let current=0;const showSlide=n=>{current=(n+slides.length)%slides.length;document.querySelectorAll('[data-slide]').forEach((el,i)=>el.classList.toggle('active',i===current));document.querySelectorAll('[data-dot]').forEach((el,i)=>el.classList.toggle('active',i===current));$('carousel-caption').textContent=slides[current][0]+' · '+(current+1)+' / '+slides.length};let touchStartX=0,touchStartY=0,swiped=false;const carousel=$('carousel');carousel.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;touchStartX=e.clientX;touchStartY=e.clientY;swiped=false});carousel.addEventListener('pointerup',e=>{const dx=e.clientX-touchStartX,dy=e.clientY-touchStartY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){swiped=true;showSlide(current+(dx<0?1:-1));setTimeout(()=>{swiped=false},350)}});carousel.addEventListener('click',e=>{if(swiped){e.preventDefault();e.stopPropagation()}},true);$('prev').onclick=()=>showSlide(current-1);$('next').onclick=()=>showSlide(current+1);document.querySelectorAll('[data-dot]').forEach(el=>el.onclick=()=>showSlide(Number(el.dataset.dot)));document.querySelectorAll('[data-zoom]').forEach(el=>el.onclick=()=>{$('zoom-img').src=el.dataset.zoom;$('zoom').classList.remove('zoomed');$('zoom-img').style.transformOrigin='center center';$('zoom').classList.add('open')});
 $('add').onclick=()=>{let cart=JSON.parse(localStorage.getItem('wizzcart')||'{}');cart[p.id]=(cart[p.id]||0)+1;localStorage.setItem('wizzcart',JSON.stringify(cart));$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)};
}).catch(()=>$('content').innerHTML='<p>No pudimos cargar el detalle. Intenta nuevamente.</p>');
const zoom=$('zoom'),zoomImg=$('zoom-img');zoom.onclick=()=>{zoom.classList.remove('open','zoomed')};zoomImg.onclick=e=>{e.stopPropagation();zoom.classList.toggle('zoomed')};zoom.addEventListener('pointermove',e=>{if(!zoom.classList.contains('zoomed'))return;const r=zoom.getBoundingClientRect();const x=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));const y=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100));zoomImg.style.transformOrigin=x+'% '+y+'%'});zoom.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'&&zoom.classList.contains('zoomed')){const r=zoom.getBoundingClientRect();zoomImg.style.transformOrigin=((e.clientX-r.left)/r.width*100)+'% '+((e.clientY-r.top)/r.height*100)+'%'}});
</script>
<script>
// Volver a la página desde la que se abrió la publicación; si se abrió directamente, ir al catálogo.
document.querySelectorAll('a.back, .nav a.cart').forEach(link=>{
  link.addEventListener('click',event=>{
    event.preventDefault();
    const sameSiteReferrer=(()=>{try{return !!document.referrer && new URL(document.referrer).origin===location.origin}catch{return false}})();
    if(history.length>1 && sameSiteReferrer) history.back();
    else location.href='index.html#catalogo';
  });
});
</script>
</body></html>
